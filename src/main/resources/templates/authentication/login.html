<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template.html}">
<head>
    <title>Login - League Soccer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }

        .title {
            text-align: center;
            color: #1e3a5f;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-icon {
            font-size: 48px;
            color: #2d5a87;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group label.required::after {
            content: " *";
            color: #e74c3c;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #2d5a87;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2d5a87 0%, #1e3a5f 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(45, 90, 135, 0.4);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        .alert-danger {
            background: #fde8e8;
            color: #c0392b;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .forgot-password {
            text-align: center;
            margin-top: 15px;
        }

        .forgot-password a {
            color: #2d5a87;
            text-decoration: none;
            font-size: 14px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #2d5a87;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
<div layout:fragment="conteudo">
    <main class="container">
        <section class="card">
            <div class="logo">
                <span class="logo-icon">⚽</span>
            </div>

            <h2 class="title">League Soccer</h2>
            <p class="subtitle">Faça login para continuar</p>

            <form method="post" th:action="@{/login}">
                <div class="alert alert-danger" th:if="${param.error != null}">
                    <strong>Dados inválidos!</strong>
                </div>

                <div class="alert alert-success" th:if="${param.logout != null}">
                    <strong>Você saiu da aplicação!</strong>
                </div>

                <div class="form-group">
                    <label for="username" class="required">Email:</label>
                    <input
                            id="username"
                            name="username"
                            type="email"
                            class="form-control"
                            placeholder="seu@email.com"
                            required
                            autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="required">Senha:</label>
                    <input
                            id="password"
                            name="password"
                            type="password"
                            class="form-control"
                            placeholder="Sua senha"
                            required
                    >
                </div>

                <button class="btn" type="submit">Entrar</button>
            </form>

            <div class="register-link">
                Não tem uma conta? <a href="/cadastro">Cadastre-se</a>
            </div>
        </section>
    </main>
</div>
</body>
</html>
